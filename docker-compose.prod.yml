# Production stack cho AWS VPS (2vCPU / 4GB RAM):
# Chạy: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  repoksv:
    container_name: repoksv-app
    ports: !reset []
    environment:
      REPOKSV_DB_PATH: /app/.study_logs/repoksv.db
      ALLOW_GUEST_DEMO: ${ALLOW_GUEST_DEMO:-false}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12,10.0.0.0/8,127.0.0.1/32,::1/128}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    mem_limit: 2g

  caddy:
    image: caddy:2-alpine
    container_name: repoksv-caddy
    depends_on:
      repoksv:
        condition: service_healthy
    environment:
      REPOKSV_DOMAIN: ${REPOKSV_DOMAIN:-repoksv.tuanpq.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
