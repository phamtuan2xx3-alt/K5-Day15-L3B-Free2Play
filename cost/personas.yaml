# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Cập nhật 27/11 19:40: tỉ lệ và tần suất lấy từ khảo sát câu 2 (evidence/survey/results.csv, chạy evidence/survey/tally.py).
#   n = 25 học viên đã nộp; bỏ 1 người "Không nhớ" → 24 người chia 3 nhóm. Giả định 1 lần nộp = 1 lần soát (tự ước tính).
#   Số lần / tháng = điểm giữa khoảng trên 14 ngày × 2 (tự ước tính). Số lượt hỏi / phiên vẫn là (tự ước tính).

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # track A: quy mô khoá học
  low: 300
  base: 700
  high: 1000
  source: "Cơ sở: lớp L3 hơn 700 học viên · cao: cả khoá hơn 1.000 học viên (README và 01-challenge-brief của bộ đề hackathon K5) · thấp: chỉ khoảng 300 người dùng thường xuyên (tự ước tính)"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: nop_it            # câu 2: "1–3 lần" + "4–8 lần" = 4/24
    share: 0.17
    uses_per_month: 9       # điểm giữa 1–8 ≈ 4,5 lần / 14 ngày × 2
    turns_per_session: 1
    source: "khảo sát n = 25, câu 2: 4/24 nộp 1–8 lần / 14 ngày · số lượt (tự ước tính)"
  - name: nop_vua           # câu 2: "9–12 lần" = 4/24
    share: 0.17
    uses_per_month: 21      # điểm giữa 9–12 ≈ 10,5 lần / 14 ngày × 2
    turns_per_session: 2
    source: "khảo sát n = 25, câu 2: 4/24 nộp 9–12 lần / 14 ngày · số lượt (tự ước tính)"
  - name: nop_nhieu         # câu 2: "Trên 12 lần" = 16/24
    share: 0.66
    uses_per_month: 26      # cận dưới 13 lần / 14 ngày × 2 (thực tế có thể cao hơn)
    turns_per_session: 2
    source: "khảo sát n = 25, câu 2: 16/24 nộp trên 12 lần / 14 ngày · số lượt (tự ước tính)"
# Mỗi lượt lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).

prices:             # USD / 1 triệu token — từ further-reading/model-prices.md của repo đề (BTC tra 25/11/2026). ≥2 mức model
                    # Đổi theo model nhóm dùng thật ở lượt 2: chi phí / task thành công phải dùng CÙNG model với tỉ lệ đạt.
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · tầng Nhỏ · theo bảng giá BTC xem 25/11/2026"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · tầng Lớn · theo bảng giá BTC xem 25/11/2026"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
